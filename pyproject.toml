[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whale-wallet-intelligence"
version = "0.8.0"
description = "Multi-chain wallet tracking with sequenced public crypto liquidity context"
readme = "README.md"
license-files = ["NOTICE.md", "licenses/*.txt"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "python-dotenv==1.2.4", "openpyxl==3.1.5", "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6", "ccxt==4.5.90",
  "aiohttp==3.14.5", "sortedcontainers==2.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3", "pip-audit==2.10.1", "packaging==26.3", "pytest-timeout==2.4.0"]

[project.scripts]
liquidity = "liquidity.cli:main"

[tool.setuptools.packages.find]
include = ["whale_watcher*", "liquidity*"]

[tool.setuptools.package-data]
liquidity = ["static/*"]
whale_watcher = ["dashboard.html", "wallet_template.xlsx", "liquidity_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
required_plugins = ["pytest-timeout>=2.4"]
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

