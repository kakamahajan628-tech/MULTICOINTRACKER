name: integrated-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_tests.py -q
      - run: python -m ruff format --check liquidity whale_watcher scripts tests
      - run: python -m ruff check liquidity whale_watcher scripts tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/pytest-hardening.xml
            reports/pytest-console.log
            reports/test-timing.json
            reports/test-run.json
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python scripts/audit_dependencies.py --lock requirements.lock --lock requirements-dev.lock
      - run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -r requirements-dev.lock --format json --output reports/pip-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audits
          path: |
            reports/dependency-audit.json
            reports/pip-audit.json
